# =============================================================================
# OMA-AI — PRODUCTION compose for oldpc (Ryzen 5 1400 / 15GB RAM / 830GB free)
# Tuned so the 4-core box never OOMs: Postgres + Redis buffers capped.
# Public ingress is Cloudflare Tunnel (see README + deploy/coolify/), NOT port 22/3000/3001.
# =============================================================================
services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    # No host port publish — Cloudflare Tunnel reaches it over the docker network.
    # If you need LAN access, uncomment:
    # ports:
    #   - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://server:3001
      - NEXT_PUBLIC_SITE_URL=https://oma-ai.com
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
        reservations:
          memory: 512m

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      # Core infra — local compose services (free, fast, no external dependency)
      - DATABASE_URL=postgresql://oma:${POSTGRES_PASSWORD}@postgres:5432/oma
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - PORT=3001
      - CORS_ORIGIN=https://oma-ai.com,https://www.oma-ai.com
      - PUBLIC_API_URL=https://api.oma-ai.com
      # Auth / crypto secrets (passed from host env / .env.prod)
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://oma-ai.com}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-https://oma-ai.com}
      - MODEL_OVERRIDES_PATH=${MODEL_OVERRIDES_PATH:-/var/lib/oma/models-overrides.json}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - RECEIPT_HMAC_SECRET=${RECEIPT_HMAC_SECRET}
      # AI provider API keys (active providers only — see server/src/config.ts)
      - VENICE_API_KEY=${VENICE_API_KEY}
      - ZYLOO_API_KEY=${ZYLOO_API_KEY}
      - ZYLOO_API_URL=${ZYLOO_API_URL}
      - OMMA_ALLOW_NON_PRIVATE_VENICE=${OMMA_ALLOW_NON_PRIVATE_VENICE}
      # Payment / treasury (LIVE for real USDC deposits)
      - FACILITATOR_MODE=${FACILITATOR_MODE:-live}
      - FACILITATOR_PRIVATE_KEY=${FACILITATOR_PRIVATE_KEY}
      - TREASURY_BASE_ADDRESS=${TREASURY_BASE_ADDRESS}
      - USDC_DEPOSIT_ADDRESS=${USDC_DEPOSIT_ADDRESS:-${TREASURY_BASE_ADDRESS}}
      - ADMIN_WALLET_ADDRESSES=${ADMIN_WALLET_ADDRESSES}
      # Chain / RPC (Base mainnet)
      - CHAIN_RPC_URL=${CHAIN_RPC_URL}
      - CHAIN_RPC_URL_FALLBACK=${CHAIN_RPC_URL_FALLBACK}
      - BASE_CHAIN_ID=${BASE_CHAIN_ID:-8453}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - model-overrides:/var/lib/oma
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
        reservations:
          memory: 512m

  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "effective_cache_size=2GB", "-c", "maintenance_work_mem=128MB", "-c", "wal_buffers=16MB", "-c", "max_connections=100"]
    environment:
      - POSTGRES_DB=oma
      - POSTGRES_USER=oma
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oma -d oma"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1g
        reservations:
          memory: 512m

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 600m
        reservations:
          memory: 256m

volumes:
  pgdata:
  redisdata:
  model-overrides:
