version: 1

profile: startup

project:
  type: app
  languages:
    - javascript
    - typescript

paths:
  include:
    - src/**
    - app/**
    - packages/**
    - services/**
  exclude:
    - "node_modules/**"
    - "**/node_modules/**"
    - "dist/**"
    - "**/dist/**"
    - "build/**"
    - ".venv/**"
    - "coverage/**"
    - ".next/**"
    - "**/.next/**"
    - "vendor/**"
    - "screenshots/**"
    - ".git/**"

baseline:
  enabled: true
  file: .vibedoctor/baseline.json
  fail_only_on_new_issues: true

score:
  minimum: 80

checks:
  security:
    enabled: true
    fail_on_secrets: true
    fail_on_new_high_vulnerabilities: true

  correctness:
    enabled: true
    fail_on_type_errors: true
    fail_on_test_failures: true

  dead_code:
    enabled: true
    delete_automatically: false
    min_confidence_to_report: medium

  leftovers:
    enabled: true
    scan_comments: true
    scan_commented_code: true
    scan_legacy_fallbacks: true
    delete_automatically: false

  refactor_readiness:
    enabled: true
    min_file_lines: 500
    min_complexity: 15
    require_tests_before_refactor: true

  tests:
    enabled: true
    min_coverage: 70
    min_changed_code_coverage: 80

  dependencies:
    enabled: true
    fail_on_missing_dependencies: true
    fail_on_new_direct_vulnerabilities: true

output:
  terminal: true
  json: .vibedoctor/report.json
  html: .vibedoctor/report.html
  agent: .vibedoctor/agent-plan.md
