title = "OMA-AI Gitleaks Config"

[allowlist]
description = "OMA AI allowlist rules"
paths = [
  '''docs/.*\.md$''',
  '''deploy/.*\.md$''',
  '''app/src/app/docs/.*''',
  '''app/src/app/models/page\.tsx$''',
  '''app/src/app/use-cases/.*''',
  '''app/src/components/landing/.*''',
  '''app/src/components/models/.*''',
  '''app/src/public/llms-full\.txt$''',
  '''render\.yaml$''',
  '''server/src/__tests__/.*\.test\.ts$''',
  '''server/vitest\.setup\.ts$''',
  '''app/src/.*\.test\.ts$''',
  '''app/src/.*\.test\.tsx$''',
  '''app/src/.*\.spec\.ts$''',
]
regexes = [
  '''oma_sk_your_key_here''',
  '''oma_sk_agent_key''',
  '''oma_sk_\.\.\.''',
  '''\$OMA_KEY''',
  '''YOUR_QUEUE_ID''',
  '''your-domain\.com''',
  '''0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913''',
]
