services:
  # ============================================================================
  # OMA-AI Render Blueprint (v5.3 G5)
  # Cost: Option A (both free) = $0/mo, Option C (app free + server starter) = $7/mo
  # With $50 Render credit: Option C = ~7 months of MVP runway
  # Docs: https://render.com/docs/blueprint-spec
  # ============================================================================

  - type: web
    name: oma-ai-app
    runtime: node
    plan: free  # Change to "starter" ($7/mo) for always-on
    rootDir: app
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm run start
    healthCheckPath: /        # App has no /health route; landing returns 200
    autoDeploy: false  # Manual deploys to control costs
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false  # Set to https://oma-ai-server.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        sync: false  # Set to https://oma-ai-app.onrender.com
      - key: NEXT_PUBLIC_QUICKNODE_MAINNET_URL
        sync: false  # QuickNode Base mainnet (multichain) HTTP endpoint
      - key: NEXT_PUBLIC_QUICKNODE_TESTNET_URL
        sync: false  # Optional dedicated Base Sepolia endpoint
      - key: PORT
        value: '3000'

  - type: web
    name: oma-ai-server
    runtime: node
    plan: starter  # Server needs always-on for WebSocket + cron jobs
    rootDir: server
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm run start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: FACILITATOR_MODE
        value: live
      - key: PORT
        value: '3001'
      - key: DATABASE_URL
        sync: false  # From Neon dashboard
      - key: REDIS_URL
        sync: false  # From Upstash or similar
      - key: JWT_SECRET
        generateValue: true  # Render generates 32+ char secret
      - key: ENCRYPTION_KEY
        generateValue: true  # Render generates 32+ char secret
      - key: CSRF_SECRET
        generateValue: true
      - key: VENICE_API_KEY
        sync: false  # Venice AI API key
      - key: SURPLUS_WALLET_PRIVATE_KEY
        sync: false  # Surplus settlement wallet private key (0x-prefixed hex)
      - key: TINYFISH_API_KEY
        sync: false
      - key: FACILITATOR_URL
        value: https://api.cdp.coinbase.com/platform/v2/x402
      - key: X402_NETWORK
        value: base-mainnet
      - key: X402_ASSET_ADDRESS
        value: 0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913
      - key: X402_PRICE_USD
        value: '0.01'
      - key: X402_FACILITATOR_PROVIDER
        value: coinbase-cdp  # "coinbase-cdp" (default) or "quicknode"
      - key: QUICKNODE_X402_URL
        sync: false  # Only set when X402_FACILITATOR_PROVIDER=quicknode; from QuickNode marketplace x402 addon
      - key: QUICKNODE_X402_API_KEY
        sync: false  # QuickNode API key for x402 facilitator calls
      - key: CORS_ORIGIN
        sync: false  # Set to https://oma-ai-app.onrender.com
      - key: LOG_LEVEL
        value: info
      - key: NODE_OPTIONS
        value: --max-old-space-size=512

      # =========================================================================
      # ONRAMP / CROSS-CHAIN DEPOSITS (LI.FI + CCTP)
      # =========================================================================
      - key: ONRAMP_WEBHOOK_SECRET
        sync: false  # Webhook signing secret for onramp callbacks (required in production)

      # =========================================================================
      # ADDITIONAL API KEYS
      # =========================================================================
      - key: GONKA_API_KEY
        sync: false  # Gonka decentralized inference broker (optional)

      # =========================================================================
      # CHAIN RPC URLs (Base mainnet)
      # =========================================================================
      - key: CHAIN_RPC_URL
        sync: false  # Base mainnet RPC (e.g. https://base-rpc.publicnode.com)
      - key: CHAIN_RPC_URL_FALLBACK
        sync: false
      - key: QUICKNODE_RPC_URL
        sync: false  # QuickNode Base mainnet endpoint
      - key: QUICKNODE_RPC_URL_FALLBACK
        sync: false

      # =========================================================================
      # WALLET & TREASURY ADDRESSES
      # =========================================================================
      - key: FACILITATOR_PRIVATE_KEY
        sync: false  # Hex-encoded private key for x402 settlement (0x...)
      - key: TREASURY_BASE_ADDRESS
        sync: false  # Base treasury address (0x...)
      - key: PRIMARY_DOMAIN
        value: oma.ai
      - key: PUBLIC_API_URL
        value: https://api.oma-ai.com

      # =========================================================================
      # WEBHOOK & HMAC SECRETS
      # =========================================================================
      - key: ONRAMP_WEBHOOK_SECRET
        sync: false  # Circle Onramp webhook verification
      - key: RECEIPT_HMAC_SECRET
        generateValue: true  # HMAC secret for receipt signing

      # =========================================================================
      # DEBUG & RELOAD SETTINGS
      # =========================================================================
      - key: DEBUG_STREAM
        value: "false"
      - key: AUTO_RELOAD_THRESHOLD
        value: "50000"
      - key: AUTO_RELOAD_AMOUNT
        value: "1000000"
      - key: AUTO_RELOAD_SPEND_LIMIT
        value: "1000000"
      - key: OMA_PRICE_OVERRIDE
        sync: false  # Override OMA price per token

      # =========================================================================
      # SPEND LIMITS
      # =========================================================================
      - key: SPEND_LIMIT_DAILY_CENTS
        value: "10000"  # $100/day default

      # =========================================================================
      # CREDIT SYSTEM
      # =========================================================================
      - key: CREDIT_EXPIRY_DAYS
        value: "90"
      - key: DEFAULT_KEY_EXPIRY_DAYS
        value: "90"

      # =========================================================================
      # ADMIN CONFIG
      # =========================================================================
      - key: ADMIN_WALLET_ADDRESSES
        sync: false  # Comma-separated admin wallet addresses
      - key: PLATFORM_TEAM_ID
        sync: false

      # =========================================================================
      # CCTP / CIRCLE CONFIG
      # =========================================================================
      - key: CCTP_CIRCLE_API_URL
        value: https://iris-api.circle.com
      - key: CCTP_SOURCE_CHAINS
        value: solana,ethereum,arbitrum,optimism,polygon,avalanche
      - key: CCTP_BASE_DOMAIN
        value: "6"

      # =========================================================================
      # BASE CHAIN CONFIG
      # =========================================================================
      - key: BASE_CHAIN_ID
        value: "8453"

      # =========================================================================
      # BILLING & WITHDRAWAL FEES
      # =========================================================================
      - key: OMA_MARKUP_PCT
        value: "25"
      - key: WITHDRAW_PROTOCOL_FEE_PERCENT
        value: "0.1"
      - key: WITHDRAW_NETWORK_FEE_ESTIMATE_USD
        value: "0.01"
      - key: WITHDRAW_DAILY_LIMIT_CENTS
        value: "5000000"  # $50,000
      - key: WITHDRAW_WEEKLY_LIMIT_CENTS
        value: "20000000"  # $200,000
      - key: WITHDRAW_NETWORK_FEE_CENTS
        value: "100"  # $1.00

      # =========================================================================
      # AFFINITY & ONRAMP CONFIG
      # =========================================================================
      - key: AFFINITY_TTL_MS
        value: "300000"
      - key: LIFI_API_URL
        value: https://li.quest/v1
      - key: LIFI_INTEGRATOR
        value: oma-ai
      - key: LIFI_SOURCE_CHAINS
        value: ethereum,arbitrum,optimism,polygon,avalanche,base,solana,bsc,gnosis,fantom

      # =========================================================================
      # OPENTELEMETRY
      # =========================================================================
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://localhost:4318
      - key: OTEL_SERVICE_NAME
        value: oma-server

      # =========================================================================
      # PROVIDER LOAD BALANCING
      # =========================================================================
      - key: PROVIDER_WEIGHTS
        sync: false  # Format: "venice:70,surplus:30"
      - key: MODEL_WEIGHTS
        sync: false  # Format: "deepseek-v3.2=venice:70,surplus:30"
      - key: PROVIDER_TIMEOUT_STREAM_MS
        value: "120000"
      - key: PROVIDER_TIMEOUT_NON_STREAM_MS
        value: "60000"
      - key: MODELS_CONFIG_PATH
        sync: false  # Path to models.json (for Docker/K8s)

      # =========================================================================
      # PROXY / CCTP / CHEAPTOKENS
      # =========================================================================
      - key: TRUSTED_PROXY_IPS
        sync: false  # Comma-separated trusted proxy IPs
      - key: CHAIN_RPC_URL_PER_CHAIN
        sync: false  # Format: "ethereum:https://...,base:https://..."
      - key: CT_DAILY_USDC_CENTS_MAX
        value: "0"  # 0 = no cap

      # =========================================================================
      # SURPLUS CONTRACT CONFIG
      # =========================================================================
      - key: SURPLUS_VERIFIER_CONTRACT
        sync: false  # Surplus verifier contract address
      - key: SURPLUS_SETTLEMENT_CONTRACT
        sync: false  # Surplus settlement proxy address
      - key: SURPLUS_PERMIT2_CONTRACT
        sync: false
      - key: SURPLUS_USDC_CONTRACT
        sync: false
      - key: SURPLUS_CHAIN_ID
        value: "8453"
      - key: SURPLUS_DEFAULT_SCHEME
        value: upto
      - key: SURPLUS_MIN_DISCOUNT_PCT
        value: "0"

      # =========================================================================
      # SESSION
      # =========================================================================
      - key: SESSION_COOKIE_TTL_MS
        value: "3600000"  # 1 hour

      # =========================================================================
      # ONRAMP
      # =========================================================================
      - key: CREDITS_PER_USD
        value: "100"
      - key: ONRAMP_MIN_USD
        value: "10"
      - key: ONRAMP_MAX_USD
        value: "1000"
      - key: CONNECTION_POOL_SIZE
        value: "10"

      # =========================================================================
      # NEON AUTH (managed Better Auth service)
      # =========================================================================
      - key: NEON_AUTH_URL
        sync: false  # From Neon console
      - key: NEON_AUTH_JWKS_URL
        sync: false  # From Neon console
      - key: NEON_AUTH_ENABLED
        value: "true"

# ============================================================================
# Cost breakdown (verified via render.com/pricing 2026-06-13)
# - Free tier: 0.1 CPU, 512MB RAM, spins down after 15min idle, slow cold starts
# - Starter: 0.5 CPU, 512MB RAM, always-on, fast
# - With $50 Render credit + Option C (free app + starter server) = ~7 months
# - With Option B (both starter) = ~3.5 months, $14/mo
# - With Option A (both free) = 0 months (free forever), but cold starts hurt UX
# Recommendation: Option C for MVP. App is mostly static (SSG) so free tier works.
# ============================================================================
