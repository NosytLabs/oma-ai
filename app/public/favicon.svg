<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="512" height="512" fill="none">
  <title>OMA</title>
  <desc>OMA AI Gateway mark: bar-equalizer badge with status LED.</desc>
  <style>
    :root { color-scheme: light dark; }
    .frame { fill: #0a0a0f; stroke: #2a2a35; }
    .baseline { stroke: #3d3d4d; }
    .mark { stroke: #f97316; }
    .dot { fill: #f97316; }
    @media (prefers-color-scheme: light) {
      .frame { fill: #fafafa; stroke: #e4e4e7; }
      .baseline { stroke: #a1a1aa; }
    }
  </style>
  <rect class="frame" x="0.5" y="0.5" width="39" height="39" rx="3" stroke-width="1"/>
  <line class="baseline" x1="8" y1="32" x2="28" y2="32" stroke-width="1" stroke-linecap="round"/>
  <line class="mark" x1="8" y1="11" x2="8" y2="28" stroke-width="3" stroke-linecap="round"/>
  <line class="mark" x1="16" y1="18" x2="16" y2="28" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line class="mark" x1="24" y1="14" x2="24" y2="28" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
  <line class="mark" x1="8" y1="14" x2="24" y2="22" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <circle class="dot" cx="32" cy="10" r="1.6"/>
</svg>