<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>OMA - One Man Army // Open Model Access</title>
  <desc>OMA logo favicon with brain-circuit O mark for all browser tabs and bookmarks</desc>
  
  <defs>
    <linearGradient id="omaGradFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffc8"/>
      <stop offset="50%" stop-color="#00e6b0"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    
    <linearGradient id="goldAccentFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb800"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    
    <filter id="glowFav" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Dark background for contrast -->
  <rect width="512" height="512" fill="#0a0a0f"/>
  <rect width="512" height="512" fill="url(#omaGradFav)" opacity="0.03"/>
  
  <!-- Icon: Stylized brain/circuit O mark - Large and centered -->
  <g transform="translate(106, 106)">
    <!-- Outer neural ring -->
    <circle cx="150" cy="150" r="140" fill="none" stroke="url(#omaGradFav)" stroke-width="4" opacity="0.2"/>
    
    <!-- Middle ring -->
    <circle cx="150" cy="150" r="105" fill="none" stroke="url(#omaGradFav)" stroke-width="3" opacity="0.4"/>
    
    <!-- Inner core ring - represents gateway -->
    <circle cx="150" cy="150" r="65" fill="none" stroke="url(#omaGradFav)" stroke-width="6" filter="url(#glowFav)"/>
    
    <!-- Cardinal neural nodes (top, bottom, left, right) -->
    <circle cx="150" cy="20" r="14" fill="#00ffc8"/>
    <circle cx="150" cy="280" r="14" fill="#00ffc8"/>
    <circle cx="20" cy="150" r="14" fill="#00ffc8"/>
    <circle cx="280" cy="150" r="14" fill="#00ffc8"/>
    
    <!-- Diagonal accent nodes -->
    <circle cx="58" cy="58" r="9" fill="#00ffc8" opacity="0.6"/>
    <circle cx="242" cy="58" r="9" fill="#00ffc8" opacity="0.6"/>
    <circle cx="58" cy="242" r="9" fill="#00ffc8" opacity="0.6"/>
    <circle cx="242" cy="242" r="9" fill="#00ffc8" opacity="0.6"/>
    
    <!-- Center core - the gateway -->
    <circle cx="150" cy="150" r="22" fill="#00ffc8" filter="url(#glowFav)"/>
    <circle cx="150" cy="150" r="10" fill="#0a0a0f"/>
  </g>
</svg>