<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <title>OMA</title>
  <desc>OMA gateway mark — open emerald ring, terminal chevron, signal. Tuned for 16–32px tabs.</desc>
  <!-- Solid plate: high contrast on light and dark browser chrome -->
  <rect width="32" height="32" rx="8" fill="#07090a"/>
  <rect x="1.25" y="1.25" width="29.5" height="29.5" rx="6.75" fill="#0d1110" stroke="#1a2420" stroke-width="0.75"/>
  <!-- Soft aperture glow -->
  <circle cx="15.25" cy="16" r="9" fill="#46d39a" opacity="0.12"/>
  <!-- Open gateway ring (gap at 3 o'clock) — thick stroke for 16px legibility -->
  <circle cx="15.25" cy="16" r="7.6" stroke="#46d39a" stroke-width="3.4" stroke-linecap="round"
    stroke-dasharray="36.2 11.5" stroke-dashoffset="-5.75"/>
  <!-- Terminal chevron — slightly larger / bolder -->
  <path d="M10.4 11.2 L18.1 16 L10.4 20.8" stroke="#46d39a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Signal token in the ring gap -->
  <circle cx="25.1" cy="16" r="2.85" fill="#46d39a"/>
  <circle cx="25.1" cy="16" r="1.2" fill="#6ee7b7"/>
</svg>
