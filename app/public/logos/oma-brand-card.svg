<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <title>OMA — Open Model Access</title>
  <desc>OMA brand card for social and brand kit.</desc>
  <rect width="1200" height="630" fill="#07090a"/>
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#46d39a" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#g)"/>
  <g transform="translate(468 175) scale(2.6)">
    <rect width="72" height="72" rx="18" fill="#0d1110" stroke="#1a2420" stroke-width="1.4"/>
    <g transform="translate(12 12) scale(1.5)">
      <circle cx="15.5" cy="16" r="13" fill="#46d39a" opacity="0.1"/>
      <circle cx="15.5" cy="16" r="10.2" stroke="#46d39a" stroke-width="3.2" stroke-linecap="round"
        stroke-dasharray="48.5 15" stroke-dashoffset="-7.5"/>
      <path d="M10 11 L20 16 L10 21" stroke="#46d39a" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="26.2" cy="16" r="3.4" fill="#46d39a" opacity="0.2"/>
      <circle cx="26.2" cy="16" r="2.15" fill="#46d39a"/>
      <circle cx="26.2" cy="16" r="0.95" fill="#6ee7b7"/>
    </g>
  </g>
  <text x="600" y="430" text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif"
    font-size="52" font-weight="600" fill="#f5f7f3" letter-spacing="-1.5">oma</text>
  <text x="600" y="480" text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
    font-size="16" font-weight="500" fill="#46d39a" letter-spacing="6">OPEN MODEL ACCESS</text>
