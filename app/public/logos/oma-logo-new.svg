<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <title>OMA AI Gateway Logo</title>
  <desc>OMA AI Gateway logo with stylized brain-circuit O mark in indigo and rose accents</desc>
  
  <defs>
    <linearGradient id="brainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
  </defs>
  
  <!-- Stylized O as AI brain/circuit -->
  <g transform="translate(10, 18)">
    <path d="M32 0 C56 0 76 16 76 38 C76 58 58 72 36 72 C18 72 0 58 0 38 C0 18 16 0 36 0" 
          fill="none" stroke="url(#brainGradient)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="18" cy="28" r="4" fill="#6366f1"/>
    <circle cx="12" cy="42" r="3" fill="#6366f1"/>
    <circle cx="22" cy="52" r="3.5" fill="#6366f1"/>
    <circle cx="54" cy="24" r="3.5" fill="#6366f1"/>
    <circle cx="60" cy="38" r="4" fill="#6366f1"/>
    <circle cx="52" cy="54" r="3" fill="#6366f1"/>
    <circle cx="36" cy="36" r="6" fill="#6366f1"/>
    <circle cx="36" cy="36" r="3" fill="#fafafa"/>
    <path d="M18 28 L30 34 M22 52 L30 40 M54 24 L42 32 M52 54 L42 40 M36 30 L36 42 M30 36 L42 36" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <circle cx="62" cy="18" r="4" fill="url(#accentGradient)"/>
  </g>
  
  <text x="105" y="70" font-family="Syne, system-ui, sans-serif" font-weight="700" font-size="52" fill="#1e1b4b" letter-spacing="-1">OMA</text>
  <text x="108" y="92" font-family="Syne, system-ui, sans-serif" font-weight="400" font-size="14" fill="#6366f1" letter-spacing="3">AI GATEWAY</text>
</svg>