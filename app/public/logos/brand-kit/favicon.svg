<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <title>OMA</title>
  <desc>OMA gateway mark — open emerald ring, terminal prompt chevron, signal dot at the gap. Dark keyline for light browser tabs.</desc>
  <!-- Dark keyline so the mark reads on light chrome tabs -->
  <circle cx="16" cy="16" r="10.4" stroke="#07090a" stroke-width="4" stroke-linecap="round"
    stroke-dasharray="50.1 15.25" stroke-dashoffset="-7.63" opacity="0.88"/>
  <rect x="10.4" y="13.85" width="10" height="4.3" rx="2.15" fill="#07090a" opacity="0.88" transform="rotate(45 20.2 16)"/>
  <rect x="10.4" y="13.85" width="10" height="4.3" rx="2.15" fill="#07090a" opacity="0.88" transform="rotate(-45 20.2 16)"/>
  <circle cx="19.1" cy="16" r="2.15" fill="#07090a" opacity="0.88"/>
  <!-- Emerald gateway -->
  <circle cx="16" cy="16" r="10.4" stroke="#46d39a" stroke-width="2.85" stroke-linecap="round"
    stroke-dasharray="50.1 15.25" stroke-dashoffset="-7.63"/>
  <rect x="11" y="14.5" width="8.8" height="3" rx="1.5" fill="#46d39a" transform="rotate(45 20.2 16)"/>
  <rect x="11" y="14.5" width="8.8" height="3" rx="1.5" fill="#46d39a" transform="rotate(-45 20.2 16)"/>
  <circle cx="19.1" cy="16" r="1.5" fill="#46d39a"/>
  <!-- Signal dot -->
  <circle cx="26.4" cy="16" r="3.4" fill="#46d39a" opacity="0.22"/>
  <circle cx="26.4" cy="16" r="2.05" fill="#46d39a" stroke="#07090a" stroke-width="0.75"/>
  <circle cx="26.4" cy="16" r="0.95" fill="#6ee7b7"/>
</svg>
