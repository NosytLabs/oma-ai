<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <title>OMA</title>
  <desc>OMA gateway mark — open emerald ring, terminal prompt chevron, signal dot at the gap.</desc>
  <!-- Subtle dark keylines: keep the mark legible on light browser tabs, invisible on void -->
  <circle cx="16" cy="16" r="10.6" stroke="#07090a" stroke-width="4.2" stroke-linecap="round"
    stroke-dasharray="51.06 15.54" stroke-dashoffset="-7.77" opacity="0.85"/>
  <rect x="10.6" y="13.9" width="10.4" height="4.2" rx="2.1" fill="#07090a" opacity="0.85" transform="rotate(45 20.4 16)"/>
  <rect x="10.6" y="13.9" width="10.4" height="4.2" rx="2.1" fill="#07090a" opacity="0.85" transform="rotate(-45 20.4 16)"/>
  <circle cx="19.34" cy="16" r="2.1" fill="#07090a" opacity="0.85"/>
  <!-- Open gateway ring (gap at 3 o'clock = open access) -->
  <circle cx="16" cy="16" r="10.6" stroke="#46d39a" stroke-width="3" stroke-linecap="round"
    stroke-dasharray="51.06 15.54" stroke-dashoffset="-7.77"/>
  <!-- Terminal prompt chevron pointing through the gap -->
  <rect x="11.2" y="14.5" width="9.2" height="3" rx="1.5" fill="#46d39a" transform="rotate(45 20.4 16)"/>
  <rect x="11.2" y="14.5" width="9.2" height="3" rx="1.5" fill="#46d39a" transform="rotate(-45 20.4 16)"/>
  <circle cx="19.34" cy="16" r="1.5" fill="#46d39a"/>
  <!-- Signal dot in the gap (live token out) -->
  <circle cx="26.6" cy="16" r="3.5" fill="#46d39a" opacity="0.25"/>
  <circle cx="26.6" cy="16" r="2.1" fill="#46d39a" stroke="#07090a" stroke-width="0.8"/>
  <circle cx="26.6" cy="16" r="1" fill="#6ee7b7"/>
</svg>
