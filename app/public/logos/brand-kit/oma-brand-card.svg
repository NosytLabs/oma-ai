<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
  <title>OMA brand card</title>
  <desc>Open Model Access brand card — void field, gateway mark, wordmark, tagline.</desc>
  <rect width="1280" height="720" fill="#07090a"/>
  <!-- soft accent glow -->
  <circle cx="420" cy="360" r="220" fill="#46d39a" opacity="0.06"/>
  <!-- Mark badge -->
  <g transform="translate(280 264)">
    <rect width="192" height="192" rx="48" fill="#07090a"/>
    <rect x="6" y="6" width="180" height="180" rx="42" fill="#0d1110" stroke="#1c2822" stroke-width="3"/>
    <g transform="translate(32 32) scale(4)">
      <circle cx="16" cy="16" r="13.5" fill="#46d39a" opacity="0.07"/>
      <circle cx="16" cy="16" r="10.6" stroke="#46d39a" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="51.06 15.54" stroke-dashoffset="-7.77"/>
      <rect x="11.2" y="14.5" width="9.2" height="3" rx="1.5" fill="#46d39a" transform="rotate(45 20.4 16)"/>
      <rect x="11.2" y="14.5" width="9.2" height="3" rx="1.5" fill="#46d39a" transform="rotate(-45 20.4 16)"/>
      <circle cx="19.34" cy="16" r="1.5" fill="#46d39a"/>
      <circle cx="26.6" cy="16" r="3.5" fill="#46d39a" opacity="0.25"/>
      <circle cx="26.6" cy="16" r="2.1" fill="#46d39a"/>
      <circle cx="26.6" cy="16" r="1" fill="#6ee7b7"/>
    </g>
  </g>
  <!-- Wordmark + tagline aligned to mark center -->
  <text x="520" y="355" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="700" font-size="96" fill="#f5f7f3" letter-spacing="-3.5">oma</text>
  <text x="520" y="410" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" font-size="22" fill="#9aa394" letter-spacing="4.5">OPEN MODEL ACCESS</text>
</svg>
