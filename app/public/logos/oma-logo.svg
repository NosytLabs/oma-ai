<?xml version="1.0" encoding="UTF-8"?>
<svg width="320" height="80" viewBox="0 0 320 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>OMA — Open Model Access</title>
  <desc>OMA AI Gateway — horizontal lockup (icon + wordmark). Unified with the navbar OmaLogo component.</desc>

  <!-- Icon block: 64x64 badge, same construction as OmaLogo (bar-equalizer). -->
  <g transform="translate(8 8)">
    <rect x="0.5" y="0.5" width="63" height="63" rx="6" fill="#0a0a0f" stroke="#2a2a30" stroke-width="1.5"/>
    <!-- baseline tick -->
    <line x1="14" y1="52" x2="42" y2="52" stroke="#5a5a64" stroke-width="1.5" stroke-linecap="round"/>
    <!-- three vertical bars, staggered heights -->
    <rect x="11" y="18" width="2.8" height="34" rx="1.4" fill="#f97316"/>
    <rect x="23" y="28" width="2.8" height="24" rx="1.4" fill="#f97316" opacity="0.7"/>
    <rect x="35" y="22" width="2.8" height="30" rx="1.4" fill="#f97316" opacity="0.45"/>
    <!-- status LED -->
    <circle cx="52" cy="16" r="1.9" fill="#f97316"/>
  </g>

  <!-- Wordmark + tagline. Tagline is on the line below OMA so it never overlaps. -->
  <text x="92" y="42" font-family="Syne, system-ui, sans-serif" font-weight="800" font-size="34" fill="#f97316" letter-spacing="-1">OMA</text>
  <text x="92" y="62" font-family="JetBrains Mono, ui-monospace, monospace" font-weight="500" font-size="9" fill="#8a8a92" letter-spacing="2.5">OPEN MODEL ACCESS</text>
</svg>
