<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 96" fill="none">
  <title>OMA — Open Model Access</title>
  <desc>OMA wordmark: gateway mark lockup with lowercase oma and Open Model Access tagline.</desc>

  <g transform="translate(8 12)">
    <rect width="72" height="72" rx="18" fill="#07090a"/>
    <rect x="2.25" y="2.25" width="67.5" height="67.5" rx="16" fill="#0d1110" stroke="#1a2420" stroke-width="1.4"/>
    <g transform="translate(12 12) scale(1.5)">
      <circle cx="15.5" cy="16" r="13" fill="#46d39a" opacity="0.1"/>
      <circle cx="15.5" cy="16" r="10.2" stroke="#46d39a" stroke-width="3.2" stroke-linecap="round"
        stroke-dasharray="48.5 15" stroke-dashoffset="-7.5"/>
      <path d="M10 11 L20 16 L10 21" stroke="#46d39a" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="26.2" cy="16" r="3.4" fill="#46d39a" opacity="0.2"/>
      <circle cx="26.2" cy="16" r="2.15" fill="#46d39a"/>
      <circle cx="26.2" cy="16" r="0.95" fill="#6ee7b7"/>
    </g>
  </g>

  <text x="100" y="56" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', ui-sans-serif, system-ui, sans-serif"
    font-weight="600" font-size="42" fill="#f5f7f3" letter-spacing="-1.2">oma</text>

  <text x="100" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="500"
    font-size="11" fill="#46d39a" letter-spacing="3.2">OPEN MODEL ACCESS</text>
</svg>
