<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" fill="none">
  <title>OMA — Open Model Access</title>
  <desc>OMA wordmark: gateway mark lockup with lowercase oma and OPEN MODEL ACCESS tagline. Adapts to light surfaces via prefers-color-scheme.</desc>
  <style>
    /* Default (dark surfaces): text-bright on void plate. */
    /* On light surfaces, flip the wordmark text so it reads on white without
       changing the mark — the void plate stays dark on purpose for contrast. */
    @media (prefers-color-scheme: light) {
      .oma-text { fill: #0d1110; }
      .oma-tagline { fill: #0a8f5a; }
    }
  </style>

  <g transform="translate(8 8)">
    <rect width="64" height="64" rx="16" fill="#07090a"/>
    <rect x="2" y="2" width="60" height="60" rx="14" fill="#0d1110" stroke="#1a2420" stroke-width="1.2"/>
    <g transform="translate(12 12)">
      <circle cx="20" cy="20" r="14" fill="#46d39a" opacity="0.1"/>
      <circle cx="20" cy="20" r="11" stroke="#46d39a" stroke-width="3.4" stroke-linecap="round"
        stroke-dasharray="52 16" stroke-dashoffset="-8"/>
      <path d="M13 14 L25 20 L13 26" stroke="#46d39a" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="33.4" cy="20" r="3.6" fill="#46d39a" opacity="0.2"/>
      <circle cx="33.4" cy="20" r="2.3" fill="#46d39a"/>
      <circle cx="33.4" cy="20" r="1.05" fill="#6ee7b7"/>
    </g>
  </g>

  <text x="92" y="50" class="oma-text"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', ui-sans-serif, system-ui, sans-serif"
    font-weight="600" font-size="40" fill="#f5f7f3" letter-spacing="-1.1">oma</text>

  <text x="92" y="70" class="oma-tagline"
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="500"
    font-size="10" fill="#46d39a" letter-spacing="2.8">OPEN MODEL ACCESS</text>
</svg>