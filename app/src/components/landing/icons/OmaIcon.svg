<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0a0a0f"/>
  <rect x="1" y="1" width="30" height="30" rx="5" stroke="#00ffc8" stroke-width="1" stroke-opacity="0.2"/>
  
  <!-- OMA letters stylized -->
  <text x="16" y="12" font-family="monospace" font-size="7" font-weight="bold" fill="#00ffc8" text-anchor="middle" opacity="0.5">OMA</text>
  
  <!-- Circuit/routing symbol -->
  <circle cx="10" cy="22" r="3" stroke="#00ffc8" stroke-width="1.2" fill="none"/>
  <circle cx="22" cy="22" r="3" stroke="#00ffc8" stroke-width="1.2" fill="none"/>
  <circle cx="16" cy="18" r="2.5" fill="#00ffc8"/>
  
  <!-- Connection paths -->
  <path d="M13 22 L19 22" stroke="#00ffc8" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M16 20.5 L10 20" stroke="#00ffc8" stroke-width="0.8" stroke-opacity="0.6"/>
  <path d="M16 20.5 L22 20" stroke="#00ffc8" stroke-width="0.8" stroke-opacity="0.6"/>
  
  <!-- Signal dots -->
  <circle cx="10" cy="22" r="1" fill="#00ffc8" fill-opacity="0.6"/>
  <circle cx="22" cy="22" r="1" fill="#00ffc8" fill-opacity="0.6"/>
</svg>