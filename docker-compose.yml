services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./app:/app
      - /app/node_modules
    command: npm run dev
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "3001:3001"
    environment:
      # Core infra
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - NODE_ENV=development
      - PORT=3001
      - CORS_ORIGIN=http://localhost:3000
      - PUBLIC_API_URL=${PUBLIC_API_URL:-https://api.oma-ai.com}

      # Auth / crypto secrets
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - RECEIPT_HMAC_SECRET=${RECEIPT_HMAC_SECRET}

      # AI provider API keys (active providers only — see server/src/config.ts)
      - VENICE_API_KEY=${VENICE_API_KEY}
      - OMMA_ALLOW_NON_PRIVATE_VENICE=${OMMA_ALLOW_NON_PRIVATE_VENICE}

      # Payment / treasury
      - FACILITATOR_MODE=${FACILITATOR_MODE:-mock}
      - FACILITATOR_PRIVATE_KEY=${FACILITATOR_PRIVATE_KEY}
      - TREASURY_BASE_ADDRESS=${TREASURY_BASE_ADDRESS}
      - USDC_DEPOSIT_ADDRESS=${USDC_DEPOSIT_ADDRESS:-${TREASURY_BASE_ADDRESS}}
      - ADMIN_WALLET_ADDRESSES=${ADMIN_WALLET_ADDRESSES}

      # Chain / RPC (Base mainnet)
      - CHAIN_RPC_URL=${CHAIN_RPC_URL}
      - CHAIN_RPC_URL_FALLBACK=${CHAIN_RPC_URL_FALLBACK}
      - BASE_CHAIN_ID=${BASE_CHAIN_ID:-8453}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=oma
      - POSTGRES_USER=oma
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oma -d oma"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
