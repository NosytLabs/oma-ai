services:
  app:
    image: oma-app:${APP_TAG:-latest}
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://api.oma-ai.com
      - NEXT_PUBLIC_APP_URL=https://oma-ai.com
      - NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=${WALLETCONNECT_PROJECT_ID}
      - NEXT_PUBLIC_BASE_TREASURY=${BASE_TREASURY}
      - NEXT_PUBLIC_SOLANA_TREASURY=${SOLANA_TREASURY}
      - NEXT_PUBLIC_TREASURY_BASE_ADDRESS=${NEXT_PUBLIC_TREASURY_BASE_ADDRESS:-${BASE_TREASURY}}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - oma-network

  server:
    image: oma-server:${SERVER_TAG:-latest}
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://oma:${POSTGRES_PASSWORD}@postgres:5432/oma
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - CSRF_SECRET=${CSRF_SECRET:-}
      - RECEIPT_HMAC_SECRET=${RECEIPT_HMAC_SECRET:-}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - FACILITATOR_MODE=${FACILITATOR_MODE:-mock}
      - BASE_TREASURY=${BASE_TREASURY}
      - SOLANA_TREASURY=${SOLANA_TREASURY}
      - CHAIN_RPC_URL=${CHAIN_RPC_URL:-https://mainnet.base.org}
      - SOLANA_RPC_URL=${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      # AI Provider keys (set the ones you have)
      - VENICE_API_KEY=${VENICE_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - DEEPINFRA_API_KEY=${DEEPINFRA_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ZERO_G_API_KEY=${ZERO_G_API_KEY:-}
      - MORPHEUS_API_KEY=${MORPHEUS_API_KEY:-}
      - LITELLM_API_KEY=${LITELLM_API_KEY:-}
      - LITELLM_PROXY_URL=${LITELLM_PROXY_URL:-}
      - ANTSEED_PROXY_URL=${ANTSEED_PROXY_URL:-}
      - TINYFISH_API_KEY=${TINYFISH_API_KEY:-}
      # Payment & wallet
      # SURPLUS_WALLET_PRIVATE_KEY — facilitator key for Surplus provider settlement.
      # Only needed when Surplus is enabled. The server uses FACILITATOR_PRIVATE_KEY
      # as its primary signing key (see server/src/config.ts). Remove TREASURY_PRIVATE_KEY:
      # this var was never read by the server and is not defined in the config schema.
      - SURPLUS_WALLET_PRIVATE_KEY=${SURPLUS_WALLET_PRIVATE_KEY:-}
      - ONRAMP_WEBHOOK_SECRET=${ONRAMP_WEBHOOK_SECRET:-}
      - OMA_API_KEY=${OMA_API_KEY:-}
      - OMA_AGENT_KEY=${OMA_AGENT_KEY:-}
      # Admin
      - ADMIN_WALLET_ADDRESSES=${ADMIN_WALLET_ADDRESSES:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - oma-network

  postgres:
    image: postgres:16-alpine
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=oma
      - POSTGRES_USER=oma
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oma -d oma"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oma-network

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oma-network

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=oma
      - POSTGRES_USER=oma
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
    volumes:
      - ./backups:/backups
    networks:
      - oma-network

volumes:
  pgdata:
  redisdata:

networks:
  oma-network:
    driver: bridge