version: '3.9'
services:
  app:
    image: oma-app:${APP_TAG:-latest}
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://api.oma-ai.com
      - NEXT_PUBLIC_APP_URL=https://oma-ai.com
      - NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=${WALLETCONNECT_PROJECT_ID}
      - NEXT_PUBLIC_BASE_TREASURY=${BASE_TREASURY}
      - NEXT_PUBLIC_SOLANA_TREASURY=${SOLANA_TREASURY}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - oma-network

  server:
    image: oma-server:${SERVER_TAG:-latest}
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://oma:${POSTGRES_PASSWORD}@postgres:5432/oma
      - REDIS_URL=redis://redis:6379
      - VENICE_API_KEY=${VENICE_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY}
      - DEEPINFRA_API_KEY=${DEEPINFRA_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - FACILITATOR_MODE=${FACILITATOR_MODE:-production}
      - BASE_TREASURY=${BASE_TREASURY}
      - SOLANA_TREASURY=${SOLANA_TREASURY}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - oma-network

  postgres:
    image: postgres:16-alpine
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=oma
      - POSTGRES_USER=oma
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oma -d oma"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oma-network

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oma-network

volumes:
  pgdata:
  redisdata:

networks:
  oma-network:
    driver: bridge