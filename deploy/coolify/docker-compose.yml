services:
  app:
    image: oma-app:${APP_TAG:-latest}
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://api.oma-ai.com
      - NEXT_PUBLIC_APP_URL=https://oma-ai.com
      - NEXT_PUBLIC_TREASURY_BASE_ADDRESS=${NEXT_PUBLIC_TREASURY_BASE_ADDRESS:-${USDC_DEPOSIT_ADDRESS}}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - oma-network

  server:
    image: oma-server:${SERVER_TAG:-latest}
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - model-overrides:/var/lib/oma
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://oma:${POSTGRES_PASSWORD}@postgres:5432/oma
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://oma-ai.com}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-https://oma-ai.com}
      - MODEL_OVERRIDES_PATH=${MODEL_OVERRIDES_PATH:-/var/lib/oma/models-overrides.json}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - RECEIPT_HMAC_SECRET=${RECEIPT_HMAC_SECRET:-}
      - CORS_ORIGIN=${CORS_ORIGIN}
      # Production must explicitly use live settlement; startup rejects mock mode.
      - FACILITATOR_MODE=${FACILITATOR_MODE:-live}
      - TREASURY_BASE_ADDRESS=${TREASURY_BASE_ADDRESS}
      - USDC_DEPOSIT_ADDRESS=${USDC_DEPOSIT_ADDRESS}
      - CHAIN_RPC_URL=${CHAIN_RPC_URL:-https://mainnet.base.org}
      # AI Provider keys (active providers only — see server/src/config.ts)
      - VENICE_API_KEY=${VENICE_API_KEY:-}
      # Payment & wallet
      - FACILITATOR_PRIVATE_KEY=${FACILITATOR_PRIVATE_KEY:-}
      # Polar.sh card rail (optional — leave POLAR_ACCESS_TOKEN unset to disable)
      - POLAR_ACCESS_TOKEN=${POLAR_ACCESS_TOKEN:-}
      - POLAR_WEBHOOK_SECRET=${POLAR_WEBHOOK_SECRET:-}
      - POLAR_ORGANIZATION_ID=${POLAR_ORGANIZATION_ID:-}
      - POLAR_SERVER=${POLAR_SERVER:-production}
      - POLAR_HOBBY_PRODUCT_ID=${POLAR_HOBBY_PRODUCT_ID:-}
      - POLAR_BUILDER_PRODUCT_ID=${POLAR_BUILDER_PRODUCT_ID:-}
      - POLAR_SCALE_PRODUCT_ID=${POLAR_SCALE_PRODUCT_ID:-}
      # Admin
      - ADMIN_WALLET_ADDRESSES=${ADMIN_WALLET_ADDRESSES:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - oma-network

  postgres:
    image: postgres:16-alpine
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=oma
      - POSTGRES_USER=oma
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oma -d oma"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oma-network

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oma-network

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=oma
      - POSTGRES_USER=oma
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
    volumes:
      - ./backups:/backups
    networks:
      - oma-network

volumes:
  pgdata:
  redisdata:
  model-overrides:

networks:
  oma-network:
    driver: bridge
