name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        default: production
        options:
          - production
          - preview

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  ci-status-gate:
    name: CI status gate
    runs-on: ubuntu-latest
    steps:
      - name: Check CI status
        uses: actions/github-script@v7
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRunsForBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: context.ref_name,
              workflow_id: 'ci.yml',
              per_page: 1,
            });

            const latestRun = runs.workflow_runs[0];
            if (!latestRun) {
              core.info('No CI runs found for this branch — proceeding with deploy');
              return;
            }

            const status = latestRun.conclusion;
            core.info(`Latest CI run #${latestRun.run_number} (${latestRun.head_sha.slice(0,7)}): ${status}`);

            if (status === 'success') {
              core.info('CI passed — proceeding with deploy');
            } else if (status === 'cancelled') {
              core.warning('CI was cancelled — proceeding with deploy anyway');
            } else {
              core.setFailed(`CI failed with status: ${status}. Fix CI before deploying.`);
            }

  deploy-app:
    name: Deploy app to Vercel
    runs-on: ubuntu-latest
    needs: [ci-status-gate]
    environment:
      name: production
      url: https://oma-ai.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter app run typecheck

      - name: Lint
        run: pnpm --filter app run lint

      - name: Test
        run: pnpm --filter app test

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel env info
        working-directory: app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_APP_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build (Vercel)
        working-directory: app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_APP_PROJECT_ID }}
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy app
        working-directory: app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_APP_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

      - name: Smoke test (/)
        if: success()
        run: |
          echo "Waiting 30s for propagation..."
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://oma-ai.com)
          if [ "$STATUS" != "200" ]; then
            echo "::error::oma-ai.com returned $STATUS"
            exit 1
          fi
          echo "oma-ai.com is up (200)"

  deploy-server:
    name: Deploy server to Vercel
    runs-on: ubuntu-latest
    needs: [ci-status-gate]
    environment:
      name: production
      url: https://api.oma-ai.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter oma-server run typecheck

      - name: Lint
        run: pnpm --filter oma-server run lint

      - name: Test
        run: pnpm --filter oma-server test

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel env info
        working-directory: server
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build (Vercel)
        working-directory: server
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy server
        working-directory: server
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

      - name: Smoke test (/health)
        if: success()
        run: |
          echo "Waiting 30s for propagation..."
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.oma-ai.com/health)
          if [ "$STATUS" != "200" ]; then
            echo "::error::api.oma-ai.com/health returned $STATUS"
            exit 1
          fi
          echo "api.oma-ai.com/health is up (200)"

  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [deploy-app, deploy-server]
    if: failure()
    steps:
      - name: Post failure summary
        run: |
          echo "::error::Deploy failed. Check the logs for deploy-app or deploy-server job above."
          echo "Likely causes:"
          echo "  1. Vercel secrets not configured (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_APP_PROJECT_ID, VERCEL_API_PROJECT_ID)"
          echo "  2. Production environment not configured in GitHub repo settings"
          echo "  3. Build failure (typecheck/lint/test) - run them locally first"
          echo "  4. DNS or domain not pointed to the right Vercel project"
