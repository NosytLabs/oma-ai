name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        default: production
        options:
          - production
          - preview
  push:
    branches: [master]
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-status-gate:
    name: CI status gate
    runs-on: ubuntu-latest
    if: ${{ always() && (github.event_name == 'workflow_run' || github.event_name == 'push') }}
    steps:
      - name: Check CI result for current SHA
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "CI did not pass: ${{ github.event.workflow_run.conclusion }}"
            exit 1
          fi
          echo "CI passed for ${{ github.event.workflow_run.head_sha }}"
      - name: Check CI status on direct push
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          # Query the CI workflow run for this exact SHA and refuse to deploy if it's not green.
          STATUS=$(gh api repos/${{ github.repository }}/commits/${SHA}/check-runs \
            --jq '[.check_runs[] | select(.name == "Server tests" or .name == "App tests" or .name == "Server typecheck" or .name == "App typecheck")] | map(.conclusion) | unique')
          echo "CI check-run conclusions for ${SHA}: ${STATUS}"
          if echo "${STATUS}" | grep -q '"failure"\|"cancelled"\|"timed_out"'; then
            echo "CI has failing checks; refusing to deploy."
            exit 1
          fi
          # If no CI run has reported yet (e.g. CI workflow still in progress), fail closed.
          if [ "${STATUS}" = "[]" ]; then
            echo "No CI results found for ${SHA}; refusing to deploy."
            exit 1
          fi

  deploy-app:
    name: Deploy app to Vercel
    runs-on: ubuntu-latest
    needs: [ci-status-gate]
    environment:
      name: production
      url: https://oma-ai.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Test
        working-directory: app
        run: npm test

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel env info
        working-directory: app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_APP_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build (Vercel)
        working-directory: app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_APP_PROJECT_ID }}
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy app
        working-directory: app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_APP_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

      - name: Smoke test (/)
        if: success()
        run: |
          echo "Waiting 30s for propagation..."
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://oma-ai.com)
          if [ "$STATUS" != "200" ]; then
            echo "::error::oma-ai.com returned $STATUS"
            exit 1
          fi
          echo "oma-ai.com is up (200)"

  deploy-server:
    name: Deploy server to Vercel
    runs-on: ubuntu-latest
    needs: [ci-status-gate]
    environment:
      name: production
      url: https://api.oma-ai.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Typecheck
        working-directory: server
        run: npm run typecheck

      - name: Lint
        working-directory: server
        run: npm run lint

      - name: Test
        working-directory: server
        run: npm test

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel env info
        working-directory: server
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build (Vercel)
        working-directory: server
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy server
        working-directory: server
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

      - name: Smoke test (/health)
        if: success()
        run: |
          echo "Waiting 30s for propagation..."
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.oma-ai.com/health)
          if [ "$STATUS" != "200" ]; then
            echo "::error::api.oma-ai.com/health returned $STATUS"
            exit 1
          fi
          echo "api.oma-ai.com/health is up (200)"

  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [deploy-app, deploy-server]
    if: failure()
    steps:
      - name: Post failure summary
        run: |
          echo "::error::Deploy failed. Check the logs for deploy-app or deploy-server job above."
          echo "Likely causes:"
          echo "  1. Vercel secrets not configured (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_APP_PROJECT_ID, VERCEL_API_PROJECT_ID)"
          echo "  2. Production environment not configured in GitHub repo settings"
          echo "  3. Build failure (typecheck/lint/test) - run them locally first"
          echo "  4. DNS or domain not pointed to the right Vercel project (see CRITICAL-1-DEPLOYMENT-RUNBOOK.md)"
