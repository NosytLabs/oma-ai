name: CI

# Site not live yet — CI disabled on PRs to prevent GitHub email spam.
# Re-enable the `pull_request` trigger when the site is ready for launch.
# Until then, run CI manually from the Actions tab via `workflow_dispatch`,
# or use `pnpm run validate` locally.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: 0
  # Belt-and-suspenders: pin to secure Node majors only. Bump when GitHub
  # Actions drops support for the current Node version.
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Server typecheck
        working-directory: server
        run: pnpm run typecheck

      - name: Server lint
        working-directory: server
        run: pnpm run lint

      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: App typecheck
        working-directory: app
        run: pnpm run typecheck

      - name: App lint
        working-directory: app
        run: pnpm run lint

  test:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Server tests
        working-directory: server
        run: pnpm test

      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: App tests
        working-directory: app
        run: pnpm test

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile --prod=false

      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile --prod=false

      - name: Audit server dependencies
        working-directory: server
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Audit app dependencies
        working-directory: app
        run: pnpm audit --audit-level=high
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and build server
        working-directory: server
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Install and build app
        working-directory: app
        run: pnpm install --frozen-lockfile && pnpm run build