name: CI

# CI runs on PRs to ensure changes don't break the build.
# Manual runs available via `workflow_dispatch` from the Actions tab,
# or use `pnpm run validate` locally.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Server typecheck
        working-directory: server
        run: pnpm run typecheck

      - name: Server lint
        working-directory: server
        run: pnpm run lint

      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: App typecheck
        working-directory: app
        run: pnpm run typecheck

      - name: App lint
        working-directory: app
        run: pnpm run lint

  test:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Server tests
        working-directory: server
        run: pnpm test

      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: App tests
        working-directory: app
        run: pnpm test

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for gitleaks detect

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Secret scanning with gitleaks — catches API keys, private keys,
      # tokens, and other secrets before they land in the repo.
      - name: GitLeaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile --prod=false

      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile --prod=false

      - name: Audit server dependencies
        working-directory: server
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Audit app dependencies
        working-directory: app
        run: pnpm audit --audit-level=high
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build server
        working-directory: server
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Install and build app
        working-directory: app
        run: pnpm install --frozen-lockfile && rm -rf .next && pnpm run build