name: Verify current daily-limit fix once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-daily-limit-once-20260923.yml']
permissions:
  contents: read
concurrency:
  group: verify-daily-limit-once
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global pnpm@9.15.9
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter oma-server exec vitest run src/middleware/__tests__/daily-limit.test.ts
      - run: pnpm --filter oma-server run typecheck
