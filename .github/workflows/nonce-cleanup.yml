name: Nonce Cleanup

on:
  # Site not live yet — schedule disabled to prevent CI spam.
  # Re-enable the schedule block (below) when the site goes live.
  workflow_dispatch:

concurrency:
  # Renamed from `cron-*` so this manual run is NOT grouped with any leftover
  # scheduled-run history (which would cancel/displace the manual run).
  group: ci-nonce-cleanup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: Clear expired SIWE nonces
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4


      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          

      - name: Install dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      # Site is in refactor/revamp phase (not live). Skip with a clear
      # warning instead of failing at server/src/config.ts:240 (envSchema
      # validates required secrets at module load).
      - name: Skip if required secrets are not configured
        id: check-secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          MISSING=""
          for var in DATABASE_URL JWT_SECRET; do
            if [ -z "${!var}" ]; then
              MISSING="$MISSING $var"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::warning::Required secrets not configured (refactor/revamp phase, site not live); skipping:$MISSING"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run nonce cleanup
        if: steps.check-secrets.outputs.skip != 'true'
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: pnpm tsx src/jobs/cli-runner.ts nonce-cleanup