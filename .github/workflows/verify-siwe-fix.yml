name: Verify SIWE fix

on:
  push:
    branches:
      - fix/better-auth-1-7-siwe-client

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate existing contracts
        run: pnpm validate

      - name: Build app
        run: pnpm --filter app run build

      - name: Build server
        run: pnpm --filter oma-server run build
