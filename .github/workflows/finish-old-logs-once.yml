name: Finish old OMA logs once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finish-old-logs-once.yml']
permissions:
  contents: read
  actions: write
jobs:
  logs:
    if: >-
      github.event.head_commit.message == 'ops: finish old OMA logs once'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NosytLabs/employee-md
          ref: b763bf2545bfbd12af6c0cd94a415bc8b15cefe1
          path: maintenance
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Remove only old logs selected by the tested preservation policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.request, urllib.error, subprocess
          from datetime import datetime, timezone
          sys.path.insert(0, 'maintenance/.github/scripts')
          from repository_hygiene import API, log_targets
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'NosytLabs/oma-ai'
          api = API(repo, os.environ['GH_TOKEN'])
          own = api.call('GET', f"actions/runs/{os.environ['GITHUB_RUN_ID']}")['workflow_id']
          api.call('PUT', f'actions/workflows/{own}/disable')
          # Read the preserved prior receipt to avoid repeating already completed deletions.
          previous_log = subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/jobs/106188445131/logs'], text=True)
          receipts = [line.split('HYGIENE_RESULT=', 1)[1] for line in previous_log.splitlines() if 'HYGIENE_RESULT={' in line]
          assert len(receipts) == 1
          previous = json.loads(receipts[0])
          assert previous['repository'] == repo
          done = set(previous['deleted_log_ids'])
          runs = api.all('actions/runs', 'workflow_runs')
          eligible = log_targets(runs, datetime.now(timezone.utc))
          targets = [run_id for run_id in eligible if run_id not in done]
          assert len(targets) <= 1800, 'Unexpected expansion of cleanup scope'
          report = {'previously_deleted': len(done), 'eligible': len(eligible), 'remaining_at_start': len(targets),
                    'deleted': 0, 'already_absent': 0, 'errors': [], 'remaining': len(targets)}
          started = time.monotonic()
          for run_id in targets:
              if time.monotonic() - started > 1620:
                  report['errors'].append('Time budget reached; no automatic retry')
                  break
              assert isinstance(run_id, int) and run_id > 0
              time.sleep(0.75)
              req = urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/logs', method='DELETE',
                    headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                             'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'NosytLabs-Requested-Log-Cleanup'})
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      assert response.status == 204
                  report['deleted'] += 1
              except urllib.error.HTTPError as error:
                  if error.code in (404, 410):
                      report['already_absent'] += 1
                  else:
                      report['errors'].append(f'Log {run_id}: HTTP {error.code}; stopped')
                      break
              except Exception as error:
                  report['errors'].append(type(error).__name__ + '; stopped')
                  break
              report['remaining'] -= 1
              if (report['deleted'] + report['already_absent']) % 100 == 0:
                  print('LOG_CLEANUP_PROGRESS=' + json.dumps(report), flush=True)
          print('LOG_CLEANUP_RESULT=' + json.dumps(report), flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('```json\n' + json.dumps(report, indent=2) + '\n```\n')
          if report['remaining']:
              raise SystemExit('Some old logs remain; receipt records the boundary')
          PY
