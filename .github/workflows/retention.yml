name: Retention

on:
  schedule:
    # Daily at 03:00 UTC. Runs the bounded-retention sweep against four
    # previously-unbounded tables (see server/src/jobs/retention.ts):
    #   usage_records         — keep  90d
    #   audit_logs            — keep 365d
    #   oracle_prices         — keep  30d
    #   deposit_notifications — keep  90d
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: cron-retention
  cancel-in-progress: false

jobs:
  run:
    name: Bounded retention sweep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4


      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: ../../.nvmrc
          cache: pnpm
          

      - name: Install dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      # Site is in refactor/revamp phase (not live). Skip with a clear
      # warning instead of failing at server/src/config.ts:240 (envSchema
      # validates required secrets at module load).
      - name: Skip if required secrets are not configured
        id: check-secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          MISSING=""
          for var in DATABASE_URL JWT_SECRET; do
            if [ -z "${!var}" ]; then
              MISSING="$MISSING $var"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::warning::Required secrets not configured (refactor/revamp phase, site not live); skipping:$MISSING"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run retention sweep
        if: steps.check-secrets.outputs.skip != 'true'
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: pnpm tsx src/jobs/cli-runner.ts retention