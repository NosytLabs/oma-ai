name: Deploy current OMA once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-current-oma-once-20260923.yml
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_7479lZJaz8NSWNiFZKgx3hpW
      VERCEL_PROJECT_ID: prj_MxWsqxnOm8814KKkNzYo4oscjjOi
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Require existing Vercel credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN is not configured for this repository."
            exit 2
          fi
      - name: Link existing project
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Deploy verified main to existing production project
        run: npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
