name: Credit Expiry

on:
  schedule:
    # Daily at 02:00 UTC (was 24h setInterval in server/src/jobs/credit-expiry.ts).
    # M10.3 schedule alignment — runs before retention (03:00 UTC) so any
    # just-expired batches get zeroed out before audit logs are pruned.
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: cron-credit-expiry
  cancel-in-progress: false

jobs:
  run:
    name: Process expired credits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4


      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: ../../.nvmrc
          cache: pnpm
          

      - name: Install dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      # Site is in refactor/revamp phase (not live). Workflows that need
      # production secrets would otherwise fail at server/src/config.ts:240
      # (envSchema.parse(process.env)). Skip with a clear warning instead of
      # burning runner minutes on a guaranteed-failure import.
      - name: Skip if required secrets are not configured
        id: check-secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          MISSING=""
          for var in DATABASE_URL JWT_SECRET; do
            if [ -z "${!var}" ]; then
              MISSING="$MISSING $var"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::warning::Required secrets not configured (refactor/revamp phase, site not live); skipping:$MISSING"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run credit expiry
        if: steps.check-secrets.outputs.skip != 'true'
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: pnpm tsx src/jobs/cli-runner.ts credit-expiry