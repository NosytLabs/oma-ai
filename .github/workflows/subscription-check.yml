name: Subscription Check

on:
  schedule:
    # Hourly. Was 1h setInterval in server/src/jobs/subscription-cron.ts.
    # Subscription periods are monthly so hourly is sufficient — most
    # ticks are no-ops.
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: cron-subscription-check
  cancel-in-progress: false

jobs:
  run:
    name: Process expired subscriptions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      # Site is in refactor/revamp phase (not live). Skip with a clear
      # warning instead of failing at server/src/config.ts:240 (envSchema
      # validates required secrets at module load).
      - name: Skip if required secrets are not configured
        id: check-secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          MISSING=""
          for var in DATABASE_URL JWT_SECRET; do
            if [ -z "${!var}" ]; then
              MISSING="$MISSING $var"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::warning::Required secrets not configured (refactor/revamp phase, site not live); skipping:$MISSING"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run subscription check
        if: steps.check-secrets.outputs.skip != 'true'
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: npx tsx src/jobs/cli-runner.ts subscription-check