name: Deployment lockfile

# Cost containment: run the install-contract check explicitly from Actions.
# Automatic dependency-PR/main triggers are paused to avoid paid runner cascades.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Validate the same frozen lockfile contract used by Vercel
        run: pnpm install --lockfile-only --frozen-lockfile --ignore-scripts
