name: Verify current OMA CI once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-current-ci-20260920.yml']
permissions:
  contents: read
  actions: write
jobs:
  verify:
    if: >-
      github.event.head_commit.message == 'ops: verify current OMA CI once'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      OPENAI_API_KEY: ''
      AI_GATEWAY_API_KEY: ''
    steps:
      - name: Disable this one-time workflow before validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .workflow_id)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/disable"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global pnpm@9.15.9
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm --filter app run build
      - run: pnpm --filter oma-server run build
