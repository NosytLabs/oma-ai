name: Retire merged docs branch
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retire-merged-docs-branch-20260924.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete exact merged branch tip
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/branches/fix%2Fdocs-seo-cleanup-and-wallet --jq .commit.sha)" = "37e56470c8914d702ae4d9ac0000f4da3e7f6a3e"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/12 --jq .merged)" = "true"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/12 --jq .head.sha)" = "37e56470c8914d702ae4d9ac0000f4da3e7f6a3e"
          gh api --method DELETE repos/$GITHUB_REPOSITORY/git/refs/heads/fix/docs-seo-cleanup-and-wallet
