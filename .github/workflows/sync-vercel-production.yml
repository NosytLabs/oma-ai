name: Sync Vercel production branch

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: vercel-production-branch
  cancel-in-progress: true

jobs:
  sync-master:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fast-forward Vercel production branch
        run: git push origin HEAD:refs/heads/master
