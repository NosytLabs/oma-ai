version: 2
updates:
  # pnpm monorepo — see pnpm-workspace.yaml. Dependabot needs the exact
  # lockfile location or it silently finds no manifest and the update job
  # fails with "the updater encountered one or more errors".
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Halifax
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
    groups:
      # One PR per minor instead of a dozen patch PRs.
      minor-updates:
        update-types:
          - minor
          - patch
