version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # typescript stays below the breaking major - never propose it.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @testing-library/jest-dom stays below the breaking major - never propose it.
      - dependency-name: "@testing-library/jest-dom"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
